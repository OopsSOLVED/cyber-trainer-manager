version: "1"

databases:
  - name: cyber-trainer-db
    plan: free
    databaseName: cybertrainer
    user: cyberadmin

services:
  # Redis Cache
  - type: redis
    name: cyber-trainer-redis
    plan: free
    ipAllowList: [] # Allows internal connections from your backend only
    maxmemoryPolicy: allkeys-lru

  # FastAPI Backend
  - type: web
    name: cyber-trainer-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyber-trainer-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cyber-trainer-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*" # Allows frontend to connect

  # React/Vite Frontend
  - type: web
    name: cyber-trainer-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cyber-trainer-api
          envVarKey: RENDER_EXTERNAL_URL
