# ================================================================
# Cybersecurity Trainer Task Manager — CI Pipeline
# ================================================================
# Runs on every push/PR to main.
# Backend: Python linting + tests
# Frontend: TypeScript type-checking + build validation
# ================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ── Backend ──────────────────────────────────────────────────
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check app/ tests/

      - name: Format check with Ruff
        run: ruff format --check app/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_NAME: "Cybersecurity Trainer Task Manager"
          DEBUG: "true"
          SECRET_KEY: "ci-test-secret-key"

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -b

      - name: Build
        run: npm run build
